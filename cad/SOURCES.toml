target = "Polarizer/SPF-50C-32.stp"
product_page = ""
step_url = ""
license_note = """
OptoSigma publishes CAD on each product page for use in customer designs.
Check the terms on the page; the same rule applies as for Thorlabs -- download
the parts you own yourself rather than redistributing the model."""

