#       --attr width_mm=25.4 --attr height_mm=25.4 \
#       --attr shearPlateBeam_mm=25.4 --attr beamBehavior=split \
#       --attr splitRatio=0.5 --attr splitPlaneRadius_mm=19 \
#       --attr splitPlaneCenterX_mm=2.5260353 \
#       --attr splitPlaneCenterY_mm=0.0014918491 \
#       --attr splitPlaneCenterZ_mm=-2.130911 \
#       --attr splitPlaneNormalX=1 --attr splitPlaneNormalY=0 \
#       --attr splitPlaneNormalZ=-1 --attr blockPlaneRadius_mm=12.7 \
#       --attr blockPlaneCenterX_mm=-0.0001568844 \
#       --attr blockPlaneCenterY_mm=0 --attr blockPlaneCenterZ_mm=22.021904 \
#       --attr blockPlaneNormalX=0 --attr blockPlaneNormalY=0 \
#       --attr blockPlaneNormalZ=1
#
# NOT a cage part despite the folder: SI254 is a shearing interferometer, the
# collimation check you drop into a 10-25.4 mm beam. Its CAD is a 50.8 mm wide
# instrument standing on the bench, with a Ø25.4 input port, a Ø40 wedged shear
# plate at 45 degrees in the horizontal plane, and the ground-glass screen on
# the +Y side where the fringes appear.
#
# Kept in the detector palette, but the authored split-plane attributes make
# the Ø38 CADMesh_003 shear plate the optical hit surface. A centered +X beam
# splits equally into a straight arm and a +Z arm. The +Z arm stops when it
# reaches the near face of CADMesh_005; a ray missing the plate is still
# blocked by the detector housing.
#
# The split-plane center is the CAD solid centroid after the asset's authored
# rotateX=180 model correction. Its (1,0,-1) normal turns +X into +Z.
[[parts]]
part = "SI254"
type = "detector"
target = "Cage/SI254-Step.step"
step_url = ""

