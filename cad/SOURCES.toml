#   python -m opticaltwin.cad_importer cad/Lens/WPHSM05-532-Step.step \
#       --component-name "Lens/WPHSM05-532-Step" --type polarizer --lod both \
#       --source-forward-axis +X --source-roll-deg -90 \
#       --source-origin -1.41 0 0 \
#       --attr clearAperture_mm=10.5 --attr diameter_mm=12.7 \
#       --attr designWavelength_nm=532 \
#       --ignore-step-colors --color 0.051269 0.051269 0.051269 \
#       --lo-color 0.051269 0.051269 0.051269
#
# Mounted Ø1/2" zero-order half-wave plate for 532 nm: a Ø12.7 mm crystal in an
# SM05 ring that turns in its housing, Ø17.78 x 10.414 mm overall.
#
# Typed `polarizer`, not a type of its own: the tracer has no `waveplate`, and
# polarizer is the one TRANSMISSIVE_TYPES member that describes an optic which
# acts on polarization and passes the beam straight through. Retardance is not
# geometry and is not modelled -- `designWavelength_nm` only records which
# wavelength the plate is cut for. Filed under Lens/ because that is where its
# CAD lives, the same rule the CCM1-BS013 follows.
#
# --source-origin puts the local origin on the crystal rather than on the ring:
# the two Ø12.7 faces are at source x = -2.413 and -0.407, so the element sits
# 1.41 mm behind the housing's own centre. clearAperture_mm = 10.5 is the
# narrowest bore measured in the CAD (r = 5.25), not a datasheet figure.
#
# The STEP has no colours, so without --ignore-step-colors nothing is authored
# at all and server.py falls back to its pale blue-grey -- the anodised black
# ring rendered as a light plastic disc. The Ø12.7 crystal does NOT get a glass
# material: this CAD is a single solid with no colour regions, so there is no
# separate mesh to make transparent. Splitting one out would mean cutting the
# geometry by radius, which nothing here does yet.
[[parts]]
part = "WPHSM05-532"
type = "polarizer"
target = "Lens/WPHSM05-532-Step.step"
step_url = ""

