# OpticalTwin — manufacturer CAD sources
#
# This file is a list of *pointers*. No vendor CAD is stored in this repository
# and none is redistributed by it. Manufacturer STEP models stay the property of
# their manufacturer, and their terms generally allow you to use them in your own
# design work but not to pass them on. So the repository ships the part numbers
# and where to get them; you download the models for the parts you own.
#
# Fetch them with:
#
#     python tools/fetch_cad.py --list           # show what is missing
#     python tools/fetch_cad.py                  # download what has a url
#
# and convert them with cad_importer.py (see docs/dev/ASSETS.md).
#
# TOML, not YAML, so `tomllib` from the Python 3.12 standard library can read it
# without adding a dependency.
#
# ---------------------------------------------------------------------------
# Filling in `step_url`
# ---------------------------------------------------------------------------
# `product_page` is a plain public catalogue link and is safe to publish.
# `step_url` is left empty on purpose: direct download links are not stable
# across vendors, and some sit behind a form. Fill in the ones you can, or leave
# them empty and let fetch_cad.py print the product page for a manual download.
#
# Do NOT paste a link to a re-upload of vendor CAD on a third-party model site.
# It does not make redistribution lawful, and it breaks whenever that upload is
# taken down. Link to the manufacturer.

version = 1

[defaults]
vendor = "Thorlabs"
# {part} is substituted with the part_number of each entry.
product_page = "https://www.thorlabs.com/thorproduct.cfm?partnumber={part}"
license_note = """
Thorlabs publishes STEP models on each product page for use in customer designs.
Thorlabs retains ownership; redistribution is not granted. Download the parts you
own yourself. Check the terms on the page before using them for anything beyond
your own layout work."""

