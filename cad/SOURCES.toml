#   python -m opticaltwin.cad_importer \
#       "cad/Camera/205-16-10_Cam.44x29_USB3.1C_CS-FP_13,3_ER-6,7.stp" \
#       --component-name "Camera/Cam-44x29-CS-205-16-10" --type camera \
#       --lod both --source-forward-axis +Z --source-origin 0 0 13.3 \
#       --color 0.051269 0.051269 0.051269 --preserve-step-parts \
#       --part-color USB3_1C=0.013,0.195,0.451 \
#       --lo-color 0.013 0.195 0.451
#
# The catalogue folder leads with "Cam", not with the "205-16-10" of the file
# name, and it has to: server.py's /add derives the USD prim name from the
# folder and only replaces illegal characters, so a folder starting with a
# digit yields the ill-formed path </Setup/205_16_10_...> and the part cannot
# be placed at all. Keep any new component folder starting with a letter.
#
# A 44 x 29 mm machine-vision camera: CS mount at the front, USB 3.1 Type-C at
# the back, four M3 screws and a tripod adapter underneath. The vendor is NOT
# identified -- "205-16-10" matches no catalogue this search could find, and
# the file name is the only documentation there is. Establish who makes it
# before publishing a link, exactly as for the A7 III above.
#
# Everything the import needs is in the file name and the CAD. The optical axis
# is the source +Z (the CS threads are coaxial with it at x = y = 0) and the
# tripod adapter is at source -Y, which becomes world down; no roll is needed.
# --source-origin 0 0 13.3 reads "CS-FP 13,3" as the focal plane 13.3 mm behind
# the mount flange face, which the CAD puts at z = 0. That is 0.8 mm past the
# nominal CS flange distance of 12.526 mm -- the size of a cover-glass
# correction, so it is believable, but it is inferred from a file name and not
# from a datasheet. Check it before trusting the drawn beam to end on the
# sensor.
#
# The sensor's own size is unknown, so no sensorWidth_mm/sensorHeight_mm is
# authored and the tracer falls back to the body cross-section, as it already
# does for the A7 III.
#
# The STEP carries no colours at all, so every shade here is authored. The real
# camera on the bench has a blue housing with black ends, which is what the
# --part-color rule paints: the body leaf (matched on "USB3_1C") gets the blue,
# and --color leaves the tripod adapter and the four M3 screws black. The
# values are linear, converted from about sRGB #1E7AB3 sampled off a photo of
# the part -- close enough to recognise it on a crowded bench, not a documented
# finish. The whole housing takes the blue because the CAD is one solid: its
# black front and rear plates are not separate leaves, so there is nothing for
# a rule to match. Colour needs --preserve-step-parts, which is why this import
# no longer passes --ignore-step-colors (the two are mutually exclusive, and
# that flag's flatten-to-one-mesh branch discards the leaf names). lo is a
# single bounding primitive with no leaves at all, hence --lo-color.
[[parts]]
part = "205-16-10 (44x29 CS-mount USB3.1 camera)"
vendor = "unidentified"
type = "camera"
target = "Camera/205-16-10_Cam.44x29_USB3.1C_CS-FP_13,3_ER-6,7.stp"
product_page = ""
step_url = ""
license_note = "Provenance unconfirmed. Do not publish a link until it is established."
