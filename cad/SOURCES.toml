#   python -m opticaltwin.cad_importer cad/Mount/LMR2_M-Step.step \
#       --component-name "Mount/LMR2_M-Step" --type mount --lod both \
#       --source-forward-axis +Z --source-origin -31.16 -32.34 15.01 \
#       --attr beamApertureRadius_mm=24.13 \
#       --ignore-step-colors --color 0.051269 0.051269 0.051269 \
#       --lo-color 0.051269 0.051269 0.051269
#
# Ø2" fixed lens mount, the LMR30_M's big brother: a 12.7 mm thick ring with an
# SM2 bore and a retaining ring, on an M4 tapped base for a Ø12.7 post.
#
# The vendor CAD is Y-up (the M4 tap is at source y = -66.76, pointing along
# -Y), and with --source-forward-axis +Z that source -Y lands on world -Z once
# the asset's own rotateX=90 is applied -- so no roll here, unlike the Z-up
# OptoSigma models. The base ends up 34.42 mm below the optical axis.
# --source-origin is the bore axis at (-31.16, -32.34) on the bore mid-plane
# z = 15.01; the optic's own thickness is unknown, so the mid-plane is the
# neutral choice rather than either seat face.
#
# Anodised black, like the LMR30_M beside it. Its STEP carries no colours, and
# `mount` defaults to metalness 0.9 / roughness 0.08, so the uncoloured import
# rendered as polished chrome.
[[parts]]
part = "LMR2_M"
type = "mount"
target = "Mount/LMR2_M-Step.step"
step_url = ""

#   python -m opticaltwin.cad_importer cad/Mount/ID25_M-Step.step \
#       --component-name "Mount/ID25_M-Step" --type iris --lod both \
#       --source-forward-axis +Z --source-origin 40.44 18.2 3.3 \
#       --lo-proxy surface --lo-target-triangles 2000 \
#       --attr aperture_mm=25 --attr outerDiameter_mm=43.74 \
#       --mesh-color CADMesh_004=0.35,0.36,0.38 \
#       --mesh-color CADMesh=0.051269,0.051269,0.051269 \
#       --mesh-opacity CADMesh_004=0.2 \
#       --lo-color 0.051269 0.051269 0.051269
#
# Ø25.0 mm iris diaphragm, post-mounted: like the ID50Z this STEP is a whole
# assembly, the iris plus the Ø12.7 post it ships on, which leaves 96.47 mm of
# post hanging below the beam. Typed `iris` although its CAD sits in cad/Mount/
# -- the folder follows the CAD, the type follows what the part does to light.
#
# The blades are the 12 leaves stacked between source z = 3.11 and 3.49, so
# --source-origin puts the local origin on their mid-plane at z = 3.3, on the
# aperture axis at (40.44, 18.2). Same --lo-proxy surface as the ID50Z and for
# the same reason: the iris branch's default primitive builds one cylinder from
# the oriented bounding box, which the post dominates.
#
# The colours are the reason --mesh-color exists. This STEP is one assembly
# leaf, so --part-color has no name to match; its pieces come out as CADMesh_001
# ... _006 split by face colour, which rendered the iris grey and brown instead
# of the anodised matte black of the real part. The broad `CADMesh` rule paints
# every one of them black; the narrow `CADMesh_004` rule, listed first so the
# broad one cannot swallow it, keeps the Ø37 disc across the bore a light grey
# at 0.2 opacity, which Component3D turns into a glass material -- the aperture
# reads as open and the beam is visible through it. CADMesh_004 is the only
# mesh that reaches into the bore (its innermost geometry is at r = 6.8; every
# other piece stops outside r = 15.6).
#
# The mesh names come from the order of the colour regions, so they are stable
# for this STEP with these flags but are not a promise: re-check them if the
# vendor reissues the model.
[[parts]]
part = "ID25/M"
type = "iris"
target = "Mount/ID25_M-Step.step"
step_url = ""

#   python -m opticaltwin.cad_importer cad/Mount/RSP1_M-Step.step \
#       --component-name "Mount/RSP1_M-Step" --type mount --lod both \
#       --source-forward-axis +Y --source-roll-deg -90 \
#       --source-origin 0 0 0 \
#       --lo-proxy surface --lo-target-triangles 9000 \
#       --ignore-step-colors --color 0.051269 0.051269 0.051269 \
#       --attr beamApertureRadius_mm=11.45
#
# Ø1" continuous rotation mount: an SM1-threaded ring that turns 360 degrees in
# its housing with a 1-degree vernier, on an M4 tapped base for a Ø12.7 post.
# The optic it carries here is a polarizer, so the angle read off the vernier is
# the polarization axis -- but the angle is a number on the part, not geometry,
# and nothing in the layout depends on it.
#
# The CAD is Z-up with its bore along the source +Y (the M4 tap runs down the
# source -Z from z = -15.37 to the -28.19 base), so it takes the same recipe as
# the other Z-up vendor models: name the optical axis with
# --source-forward-axis and roll -90 to put the model's own +Z back on world up.
# The CAD origin is already on the bore axis at mid-thickness, so
# --source-origin stays at zero.
#
# beamApertureRadius_mm = 11.45 is the Ø22.9 clear aperture, and it is the whole
# point of this entry: a `mount` with no aperture authored blocks the beam, and
# the first import of this part stopped the laser dead at the polarizer. The
# radius is the narrowest cylinder on the bore axis in the CAD (r = 11.455),
# not the Ø25.4 optic it holds.
#
# --lo-proxy surface for the same reason as the KLH-BE-M22H: this is a 32k
# triangle assembly and the default mount `mesh` proxy came out at 1.1 MB, which
# ships in every project payload. 8300 triangles (305 kB) still reads as a
# rotation mount with its vernier scale.
[[parts]]
part = "RSP1/M"
type = "mount"
target = "Mount/RSP1_M-Step.step"
step_url = ""

