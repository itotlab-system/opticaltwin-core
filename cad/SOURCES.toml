# Filed under Polarizer, not Lens: the vendor STEP's own directory path reads
# 7_素子/ポラライザー/18_可視偏光ﾌｨﾙﾀｰ(SPF)/SPF-50C-32 — a visible-range
# polarizing filter. Ø50 × 6 mm, with a Ø44 recessed optical zone on each face.
# product_page is left empty: OptoSigma's catalogue refuses automated requests,
# so the URL could not be confirmed. Paste it in once you have opened the page.
#
#   python -m opticaltwin.cad_importer cad/Polarizer/SPF-50C-32.stp \
#       --component-name "Polarizer/SPF-50C-32" --type polarizer --lod both \
#       --source-forward-axis +Y --source-origin 0 3 0 \
#       --ignore-step-colors --color 0.6 0.7 0.8 --opacity 0.35 \
#       --attr clearAperture_mm=44.0
#
# The disc lies in the source XZ plane, so its thickness runs along +Y and that
# is the optical axis. --source-origin puts the origin at the disc's mid-plane
# rather than on its front face. The STEP carries no face colours, and --color
# is only consulted once --ignore-step-colors is set, so without that flag the
# filter renders as untinted near-white instead of LPVISE100-A's pale glass.
[[parts]]
