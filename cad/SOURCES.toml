#   python -m opticaltwin.cad_importer cad/SLM/EXULUS-SE1-Step.step \
#       --component-name "SLM/EXULUS-SE1-Step" --type slm --lod both \
#       --source-forward-axis +Z --source-origin -39.3 9.7 -48.5 \
#       --preserve-step-parts \
#       --color 0.051269 0.051269 0.051269 \
#       --part-color EEC4011_housing=0.62,0.09,0.10 \
#       --part-color RDP551F_MODULE=0.32,0.34,0.37 \
#       --attr reflective=true \
#       --attr activeWidth_mm=7.0 --attr activeHeight_mm=13.0 \
#       --attr screenWidth_mm=7.0 --attr screenHeight_mm=13.0 \
#       --attr screenThickness_mm=0.7
#
# The LCOS module sits at the -Z end of the STEP and every one of its optical
# faces points -Z, so the beam arrives along +Z: that maps onto the optical +X,
# leaving the housing behind the panel exactly as EXULUS-HD2HP has it.
# --source-origin puts the local origin on the active surface, which is what the
# slm branch of the importer assumes.
#
# **The 13.0 x 7.0 mm active area is measured off the CAD**, from the innermost
# rectangle of the module's optical stack (its centre lands on the housing axis
# to within 0.04 mm, which is what makes it believable). It is not a datasheet
# number — check it against the EXULUS-SE1 spec before trusting the drawn beam
# footprint. Without these attrs the importer falls back to *half the envelope*,
# which is how this part first came in with a 17.98 x 24.33 mm "screen".
#
# The STEP carries no face colours at all, so every part of it first rendered
# as the near-white default. --preserve-step-parts keeps the assembly's leaves
# as named Xforms, and --part-color then paints the real thing: a red anodised
# extrusion between black end caps, with the LCOS module a lighter grey so the
# screen reads through the aperture. 0.051269 is the black anodised grey used
# across the catalogue, and the module grey is the same value write_lo_proxy
# gives the lo Display panel, so the two levels of detail agree.
#
# The module is one CAD leaf -- board, screen and mounting tabs together -- and
# those tabs stand ~10 mm proud of the housing on both sides, so it is painted
# panel grey rather than a bright screen white that would light them up too.
[[parts]]
part = "EXULUS-SE1"
type = "slm"
target = "SLM/EXULUS-SE1-Step.step"
step_url = ""

# ---------------------------------------------------------------------------
# Beam expanders
# ---------------------------------------------------------------------------
#   python -m opticaltwin.cad_importer cad/Expander/LBED-10.stp \
#       --component-name "Expander/LBED-10" --type lens --lod both \
#       "--source-forward-axis=-Y" --source-roll-deg 90 \
#       --source-origin 0 -57.75 0 --lo-proxy cylinder \
#       --ignore-step-colors --color 0.051269 0.051269 0.051269 \
#       --attr magnification=10 --attr barrelDiameter_mm=41.386
#
# ×10 laser beam expander with diopter (focus) adjustment. Filed as `lens` and
# imported as a barrel proxy, the same treatment as the MVL objectives: it is a
# telescope, not a bare element, so there is no surface to fit. Beam expansion
# itself is not modelled -- draw it with the beam editor's expand preset if you
# want the downstream leg to widen.
#
# Light enters the M22 threaded end (source y ≈ 0, entrance bore Ø16) and
# leaves the far end 116 mm away (exit bore Ø27), so the optical axis is the
# source -Y. --source-roll-deg 90 turns the side lock screw from pointing
# straight down to sideways; nothing else about a tube depends on the roll.
# --source-origin centres it on its own length.
#
# The STEP carries no face colours at all, so without --ignore-step-colors it
# renders as the near-white default; the real body is black anodised, which is
# what 0.051269 is across this catalogue.
#
# NOTE: the leading "=" in "--source-forward-axis=-Y" is required. Written with
# a space, argparse reads "-Y" as a flag and the import fails.
[[parts]]
part = "LBED-10"
vendor = "OptoSigma"
type = "lens"
target = "Expander/LBED-10.stp"
product_page = "https://jp.optosigma.com/en_jp/lbed-10.html"
step_url = ""
license_note = """
OptoSigma publishes CAD on each product page for use in customer designs.
Check the terms on the page; the same rule applies as for Thorlabs -- download
the parts you own yourself rather than redistributing the model."""

#   python -m opticaltwin.cad_importer cad/Holder/KLH-BE-M22H.stp \
#       --component-name "Holder/KLH-BE-M22H" --type mount --lod both \
#       --source-forward-axis +Y --source-roll-deg -90 \
#       --source-origin 0 -3.2245 0 \
#       --lo-proxy surface --lo-target-triangles 9000 \
#       --ignore-step-colors --color 0.051269 0.051269 0.051269 \
#       --attr beamApertureRadius_mm=10.65
#
# The four-axis kinematic holder the LBED-10 screws into (tip, tilt and
# centring, with locks). Its CAD is already Z-up with the base 35.9 mm below
# the bore, so the recipe is the general one for a Z-up vendor model: name the
# optical axis with --source-forward-axis and roll -90 to put the model's own
# +Z back on world up.
#
# --type mount, not holder: `holder` in this repository means a post holder,
# and it carries a forced rotation plus bottom-centering that would stand this
# part on end. `mount` is structural to the tracer either way, but a mount
# without optics:beamApertureRadius_mm blocks the beam -- 10.65 mm is the M22
# thread's own bore, measured off the CAD.
#
# --lo-proxy surface because the default mount `mesh` proxy is a 1.8 MB lo for
# this one, and every lo asset ships in the project payload. 9000 triangles
# (310 kB) still reads as a kinematic mount with its knobs; 2500 was a blob.
[[parts]]
part = "KLH-BE-M22H"
vendor = "OptoSigma"
type = "mount"
target = "Holder/KLH-BE-M22H.stp"
product_page = "https://jp.optosigma.com/en_jp/klh-be-m22h.html"
step_url = ""
license_note = """
OptoSigma publishes CAD on each product page for use in customer designs.
Check the terms on the page; the same rule applies as for Thorlabs -- download
the parts you own yourself rather than redistributing the model."""

