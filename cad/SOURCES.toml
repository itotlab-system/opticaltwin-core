# ---------------------------------------------------------------------------
# Non-Thorlabs
# ---------------------------------------------------------------------------
# The camera body is not an optomechanical catalogue part and its provenance in
# this project is not recorded. Before publishing a URL for it, establish where
# the model actually came from and what its terms are -- a model re-uploaded to
# a community CAD site is usually not the manufacturer's to give away, and
# linking it does not fix that.
#
# Any camera-shaped mesh works: the layout only needs the sensor plane and the
# body envelope. Substituting a self-made block model is the safe default.
[[parts]]
part = "Sony A7 III + FE 28-70"
vendor = "Sony (provenance unconfirmed)"
type = "camera"
target = "Camera/A7 III + FE 28-70 v4.step"
product_page = ""
step_url = ""
license_note = "Provenance unconfirmed. Do not publish a link until it is established."
