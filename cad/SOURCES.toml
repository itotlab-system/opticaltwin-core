# Cage system
# ---------------------------------------------------------------------------
#   python -m opticaltwin.cad_importer cad/Cage/CCM1-BS013_M-Step.step \
#       --component-name "Cage/CCM1-BS013_M-Step" --type beamsplitter \
#       --lod both --source-forward-axis +X --source-origin 0 0 0 \
#       --preserve-step-solids \
#       --ignore-step-colors --color 0.051269 0.051269 0.051269 \
#       --attr splitRatio=0.5 --attr diameter_mm=25.4 --attr size_mm=38.1
#
# 50:50 non-polarizing beamsplitter, 400-700 nm, already mounted in a CM1 cage
# cube. Filed under Cage because that is where its CAD lives, but typed
# `beamsplitter`: `cage` is structural to the tracer and the beam would fly
# straight through instead of splitting.
#
# This is the one import in the catalogue where the roll is forced by physics
# rather than by which way is up. beam_tracer builds the splitting interface as
# normalise(x_axis + y_axis) -- always 45 degrees in the horizontal plane, so
# the deflected arm leaves along local -Y. The CAD's own interface is the plane
# |n| = (0.707, 0, 0.707) through the origin, i.e. 45 degrees in its XZ plane,
# and world XY maps to authored X/-Z. So +X with **no roll** is the only
# setting that puts the two Ø25.7 ports on world X and world Y. Rolling it 90
# degrees to make the engraved label face sideways would tip the split into the
# vertical plane and send the reflected arm at the ceiling.
[[parts]]
part = "CCM1-BS013/M"
type = "beamsplitter"
target = "Cage/CCM1-BS013_M-Step.step"
step_url = ""

