<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpticalTwin</title>
    <!-- Inline, so there is no separate file to miss: without an icon every
         page load logged a 404 for /favicon.ico. A beam through a lens. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f1115'/%3E%3Cpath d='M3 16h26' stroke='%2334e0a1' stroke-width='3' stroke-linecap='round'/%3E%3Cellipse cx='16' cy='16' rx='4' ry='10' fill='%230f1115' stroke='%23e8eaf0' stroke-width='2'/%3E%3C/svg%3E" />
    <script>
      // SettingsProvider sets data-theme in an effect, i.e. after the first
      // paint — which flashed the default dark palette at a light-theme member
      // before the login page swapped. Apply the saved choice before paint.
      try {
        var r = document.documentElement;
        r.setAttribute(
          "data-theme",
          localStorage.getItem("ot.theme") === "light" ? "light" : "dark"
        );
        r.lang = localStorage.getItem("ot.lang") === "ja" ? "ja" : "en";
      } catch (e) { /* private mode: fall through to the CSS default */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
