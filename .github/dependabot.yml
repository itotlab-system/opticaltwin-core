version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies"]

  - package-ecosystem: npm
    directory: "/app"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      # React, R3F and drei move together; separate PRs for each just create
      # version mismatches that fail to build.
      react-three:
        patterns:
          - "@react-three/*"
          - "three"
          - "@types/three"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies"]
